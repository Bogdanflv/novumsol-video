<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><title>Novum Sol clip</title>
<style>
@font-face{font-family:'ID';src:url('file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf');font-weight:900}
@font-face{font-family:'ID';src:url('file:///usr/share/fonts/opentype/inter/InterDisplay-ExtraBold.otf');font-weight:800}
@font-face{font-family:'IT';src:url('file:///usr/share/fonts/opentype/inter/Inter-Medium.otf');font-weight:500}
@font-face{font-family:'IT';src:url('file:///usr/share/fonts/opentype/inter/Inter-SemiBold.otf');font-weight:600}
@font-face{font-family:'IT';src:url('file:///usr/share/fonts/opentype/inter/Inter-Bold.otf');font-weight:700}
@font-face{font-family:'IT';src:url('file:///usr/share/fonts/opentype/inter/Inter-ExtraBold.otf');font-weight:800}
:root{--g:#007A3F;--gd:#004D27;--gl:#F3F9F5;--ink:#161925;--am:#F2A93B;--or:#E07A1F;--acc:#F2A93B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:'IT',sans-serif}
.scene{position:absolute;inset:0;overflow:hidden;display:none}.scene.on{display:block}
.abs{position:absolute}.full{position:absolute;inset:0}.center{left:0;right:0;text-align:center}

@keyframes fadeUp{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes lineUp{from{transform:translateY(115%)}to{transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes badgePop{0%{opacity:0;transform:scale(.2) rotate(-50deg)}60%{opacity:1;transform:scale(1.14) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(-12deg)}}
@keyframes sunrise{from{opacity:0;transform:translateY(300px) scale(.7)}to{opacity:1;transform:none}}
@keyframes hillsUp{from{transform:translateY(460px)}to{transform:none}}
@keyframes wipeUp{from{transform:translateY(2000px)}to{transform:translateY(-320px)}}
@keyframes cardIn{0%{transform:translateX(950px) rotate(14deg)}68%{transform:translateX(-30px) rotate(-3deg)}100%{transform:translateX(0) rotate(-1.5deg)}}
@keyframes cardOut{from{transform:translateX(0) rotate(-1.5deg)}to{transform:translateX(-1350px) rotate(-12deg)}}
@keyframes txtOut{from{transform:translateX(0)}to{transform:translateX(-1300px)}}
@keyframes textIn{from{opacity:0;transform:translateX(180px)}to{opacity:1;transform:none}}
@keyframes strike{from{transform:scaleX(0) rotate(-7deg)}to{transform:scaleX(1) rotate(-7deg)}}
@keyframes circIn{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes circFill{from{transform:scale(1)}to{transform:scale(4.6)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{from{transform:translateY(-10px)}to{transform:translateY(10px)}}
@keyframes fall{from{transform:translateY(-160px)}to{transform:translateY(2080px)}}
@keyframes sway{from{transform:translateX(-55px) rotate(-40deg)}to{transform:translateX(55px) rotate(40deg)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.045)}}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.06)}}

.leaf{position:absolute;top:0}
.logo{background:#fff;border-radius:999px;padding:14px 30px;display:inline-flex;align-items:center;box-shadow:0 10px 30px rgba(0,40,20,.18)}
.logo img{display:block;height:var(--lh,64px);width:auto;max-width:520px;object-fit:contain}
.hills{position:absolute;left:0;bottom:0;width:1080px;height:440px}

/* bandă legală art. 66 */
.legal{position:absolute;left:0;right:0;bottom:0;padding:22px 56px 30px;background:rgba(10,22,16,.86);color:#fff;
 font-size:29px;line-height:1.32;font-weight:600;text-align:center;z-index:50}
.legal b{color:var(--am);font-weight:800}

/* intro */
#intro .bg{background:radial-gradient(130% 90% at 50% 18%,#13A45C 0%,#007A3F 45%,#00512A 100%)}
#intro .sun{left:220px;top:250px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,#FFE2A0 0%,#F6B84A 46%,#F2A93B 58%,rgba(242,169,59,0) 71%);animation:sunrise 1.3s cubic-bezier(.2,.8,.2,1) .05s both}
#intro .glow{left:20px;top:50px;width:1040px;height:1040px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,130,.32) 0%,rgba(255,214,130,0) 62%);animation:fadeIn 1.6s ease .1s both}
#intro .lg{top:110px;left:0;right:0;display:flex;justify-content:center;--lh:78px;animation:fadeDown .7s ease .15s both}
#intro .kick{top:850px;font-size:40px;font-weight:800;letter-spacing:.2em;color:#FFE2A0;animation:fadeUp .6s ease .3s both}
#intro .h{position:absolute;left:0;right:0;top:920px;text-align:center;font-family:'ID';font-weight:900;font-size:136px;line-height:1.0;letter-spacing:-.025em}
#intro .h .ln{display:block;overflow:hidden;padding:0 0 10px}
#intro .h .ln span{display:inline-block;white-space:nowrap}
#intro .h .l1 span{color:#fff;animation:lineUp .75s cubic-bezier(.2,.85,.25,1) .45s both}
#intro .h .l2 span{color:var(--am);animation:lineUp .75s cubic-bezier(.2,.85,.25,1) .6s both}
#intro .sub{top:1250px;padding:0 70px;font-size:44px;line-height:1.25;font-weight:600;color:rgba(255,255,255,.94);animation:fadeUp .7s ease 1.0s both}
#intro .pill{top:1395px;left:0;right:0;display:flex;justify-content:center;animation:pop .6s cubic-bezier(.3,1.4,.5,1) 1.3s both}
#intro .pill span{background:var(--am);color:#2A1A05;font-weight:800;font-size:42px;padding:20px 44px;border-radius:999px;box-shadow:0 14px 34px rgba(0,0,0,.25)}
#intro .hills{animation:hillsUp 1.1s cubic-bezier(.2,.8,.2,1) .2s both}
#intro .wipe{left:-200px;width:1480px;top:0;height:2400px;background:var(--gl);border-radius:50% 50% 0 0/260px 260px 0 0;z-index:60}

/* produs */
.prod .bg{background:radial-gradient(110% 70% at 50% 36%,#FFFFFF 0%,var(--gl) 55%,#E4F1E8 100%)}
.prod .head{position:absolute;top:70px;left:56px;right:56px;display:flex;justify-content:space-between;align-items:center;--lh:54px}
.prod .chip{display:flex;align-items:center;gap:12px;background:#FDEBCF;color:#9A4B0B;font-weight:800;font-size:30px;padding:14px 26px;border-radius:999px;max-width:470px;white-space:nowrap}
.prod .ring{left:95px;top:255px;width:890px;height:890px;border-radius:50%;border:5px dashed rgba(242,169,59,.75);animation:spin 40s linear infinite}
.prod .circle{left:140px;top:300px;width:800px;height:800px;border-radius:50%;background:var(--g);overflow:hidden}
.prod .circle .hl{position:absolute;inset:0;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 55%),radial-gradient(circle at 70% 85%,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 55%)}
.prod .card{position:absolute;left:215px;top:355px;width:650px;height:690px;background:#fff;border-radius:44px;box-shadow:0 30px 60px rgba(0,40,20,.30);overflow:hidden;display:flex;align-items:center;justify-content:center}
.prod .card img{max-width:590px;max-height:630px;object-fit:contain;animation:kenburns 4s ease-out both}
.prod .fl{position:absolute;inset:0;animation:floaty 1.7s ease-in-out -0.85s infinite alternate}
.prod .badge{left:752px;top:250px;width:236px;height:236px;border-radius:50%;background:var(--am);color:#2A1A05;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 16px 36px rgba(120,60,0,.35);animation:badgePop .6s cubic-bezier(.3,1.4,.5,1) 1.75s both}
.prod .badge::before{content:"";position:absolute;inset:12px;border-radius:50%;border:3px dashed rgba(255,255,255,.85)}
.prod .badge .b1{font-size:22px;font-weight:800;letter-spacing:.14em}
.prod .badge .b2{font-family:'ID';font-weight:900;font-size:84px;line-height:.95;letter-spacing:-.03em}
.prod .badge .b3{font-size:30px;font-weight:800}
.prod .maker{top:1150px;font-size:32px;font-weight:800;letter-spacing:.3em;color:var(--g);animation:textIn .6s cubic-bezier(.2,.85,.25,1) .3s both}
.prod .name{top:1195px;padding:0 40px;animation:textIn .6s cubic-bezier(.2,.85,.25,1) .4s both}
.prod .name span{display:inline-block;white-space:nowrap;font-family:'ID';font-weight:900;font-size:104px;letter-spacing:-.02em;color:var(--ink)}
.prod .desc{top:1328px;padding:0 70px;font-size:38px;line-height:1.22;font-weight:600;color:#4B5762;animation:textIn .6s cubic-bezier(.2,.85,.25,1) .55s both}
.prod .old{top:1430px;left:0;right:0;display:flex;justify-content:center;animation:fadeIn .4s ease 1.0s both}
.prod .old .o{position:relative;font-size:56px;font-weight:700;color:#8C969E}
.prod .old .o i{position:absolute;left:-10px;right:-10px;top:50%;height:7px;margin-top:-3px;background:#D2462F;border-radius:4px;transform-origin:left center;animation:strike .35s ease-out 1.25s both}
.prod .new{top:1490px;left:0;right:0;display:flex;justify-content:center;align-items:baseline;gap:18px;color:var(--g);animation:pop .55s cubic-bezier(.3,1.4,.5,1) 1.5s both}
.prod .new.nosale{top:1450px}
.prod .new .n{font-family:'ID';font-weight:900;font-size:160px;letter-spacing:-.035em;line-height:1}
.prod .new .u{font-family:'ID';font-weight:900;font-size:68px}
.prod .foot{position:absolute;left:0;right:0;bottom:200px;display:flex;justify-content:center}
.prod .foot span{font-size:32px;font-weight:700;color:#2E3A44;background:#fff;padding:16px 34px;border-radius:999px;box-shadow:0 8px 24px rgba(0,60,30,.10)}
.prod .foot b{color:var(--g)}
.prod.first .head,.prod.first .foot{animation:fadeIn .45s ease .1s both}
.prod.first .circle{animation:circIn .6s cubic-bezier(.2,.9,.3,1.1) 0s both}
.prod.first .ring{animation:fadeIn .6s ease .2s both,spin 40s linear infinite}

/* outro */
#outro .bg{background:radial-gradient(130% 90% at 50% 18%,#13A45C 0%,#007A3F 45%,#00512A 100%)}
#outro .sun{left:300px;top:150px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,#FFE2A0 0%,#F6B84A 46%,#F2A93B 58%,rgba(242,169,59,0) 71%);animation:sunrise 1.2s cubic-bezier(.2,.8,.2,1) .05s both}
#outro .lg{top:560px;left:0;right:0;display:flex;justify-content:center;--lh:120px;animation:pop .7s cubic-bezier(.3,1.4,.5,1) .25s both}
#outro .lg .logo{padding:26px 50px}
#outro .slog{top:790px;font-size:44px;font-weight:700;color:var(--am);animation:fadeUp .7s ease .45s both}
#outro .cta{top:900px;font-family:'ID';font-weight:900;font-size:112px;letter-spacing:-.02em;color:#fff;animation:fadeUp .7s ease .6s both}
#outro .btnw{top:1065px;left:0;right:0;display:flex;justify-content:center;animation:pop .6s cubic-bezier(.3,1.4,.5,1) .85s both}
#outro .btn{background:#fff;color:var(--g);font-family:'ID';font-weight:900;font-size:84px;padding:28px 68px;border-radius:999px;box-shadow:0 20px 50px rgba(0,0,0,.28);animation:pulse .55s ease-in-out 1.6s infinite alternate}
#outro .tel{top:1270px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:22px;color:#fff;font-family:'ID';font-weight:900;font-size:74px;animation:fadeUp .6s ease 1.1s both}
#outro .mail{top:1380px;font-size:38px;font-weight:600;color:rgba(255,255,255,.9);animation:fadeUp .6s ease 1.25s both}
#outro .hills{animation:hillsUp 1.0s cubic-bezier(.2,.8,.2,1) .15s both}
</style></head>
<body>
<section class="scene" id="intro">
 <div class="full bg"></div><div class="abs glow"></div><div class="abs sun"></div>
 <div class="abs lg"><div class="logo"><img class="logoimg"></div></div>
 <div class="leaves full" data-n="10" data-seed="7"></div>
 <div class="abs center kick" id="i_kick"></div>
 <div class="h"><span class="ln l1"><span class="fit" data-max="1000" id="i_l1"></span></span><span class="ln l2"><span class="fit" data-max="1000" id="i_l2"></span></span></div>
 <div class="abs center sub" id="i_sub"></div>
 <div class="abs pill" id="i_pillw"><span id="i_pill"></span></div>
 <svg class="hills" viewBox="0 0 1080 440" preserveAspectRatio="none">
  <path d="M0 150 C 260 60, 620 60, 1080 170 L1080 440 L0 440 Z" fill="#0E9150"/>
  <path d="M0 250 C 320 170, 720 190, 1080 260 L1080 440 L0 440 Z" fill="#006C37"/>
  <path d="M0 360 C 350 310, 760 320, 1080 370 L1080 440 L0 440 Z" fill="#00512A"/></svg>
 <div class="abs wipe" id="i_wipe"></div>
</section>
<div id="prods"></div>
<section class="scene" id="outro">
 <div class="full bg"></div><div class="abs sun"></div>
 <div class="leaves full" data-n="8" data-seed="21"></div>
 <div class="abs lg"><div class="logo"><img class="logoimg"></div></div>
 <div class="abs center slog" id="o_slog"></div>
 <div class="abs center cta" id="o_cta"></div>
 <div class="abs btnw"><div class="btn">novumsol.ro</div></div>
 <div class="abs tel"><svg width="70" height="70" viewBox="0 0 24 24"><path fill="#F2A93B" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>0754 460 345</div>
 <div class="abs center mail" id="o_mail"></div>
 <svg class="hills" viewBox="0 0 1080 440" preserveAspectRatio="none">
  <path d="M0 150 C 260 60, 620 60, 1080 170 L1080 440 L0 440 Z" fill="#0E9150"/>
  <path d="M0 250 C 320 170, 720 190, 1080 260 L1080 440 L0 440 Z" fill="#006C37"/>
  <path d="M0 360 C 350 310, 760 320, 1080 370 L1080 440 L0 440 Z" fill="#00512A"/></svg>
</section>
<script src="clip_data.js"></script>
<script>
const C=window.CLIP, T=C.timing;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.querySelectorAll('.logoimg').forEach(i=>i.src=C.logo);
$('i_kick').textContent=C.intro.kicker||'';
$('i_l1').textContent=C.intro.title[0]; $('i_l2').textContent=C.intro.title[1]||'';
$('i_sub').textContent=C.intro.sub||'';
if(C.intro.pill)$('i_pill').textContent=C.intro.pill; else $('i_pillw').remove();
$('i_wipe').style.animation=`wipeUp .55s cubic-bezier(.65,0,.35,1) ${T.intro-0.55}s both`;
$('o_slog').textContent=C.outro.slogan; $('o_cta').textContent=C.outro.cta; $('o_mail').textContent=C.outro.line||'';
const fmt=v=>{const n=Number(v);return Number.isInteger(n)?String(n):n.toFixed(2).replace('.',',')};
const wrap=$('prods');
C.products.forEach((p,k)=>{
 const last=k===C.products.length-1, first=k===0, D=T.prod;
 const s=document.createElement('section'); s.className='scene prod'+(first?' first':''); s.id='p'+(k+1);
 const sale=p.on_sale&&p.regular_price&&p.regular_price>p.price;
 const off=sale?Math.round(p.regular_price-p.price):0;
 s.innerHTML=`<div class="full bg"></div><div class="abs ring"></div><div class="abs circle"><div class="hl"></div></div>
 <div class="head"><div class="logo"><img src="${C.logo}"></div><div class="chip">${esc(C.chip)}</div></div>
 <div class="full can"><div class="fl"><div class="card"><img src="${p.image}"></div></div>
 ${sale?`<div class="abs badge"><div class="b1">REDUCERE</div><div class="b2">−${off}</div><div class="b3">lei</div></div>`:''}</div>
 <div class="full txt">
  <div class="abs center maker">${esc(p.maker||'')}</div>
  <div class="abs center name"><span class="fit" data-max="1000">${esc(p.title)}</span></div>
  <div class="abs center desc">${esc(p.line||'')}</div>
  ${sale?`<div class="abs old"><span class="o">${fmt(p.regular_price)} lei<i></i></span></div>`:''}
  <div class="abs new ${sale?'':'nosale'}"><span class="n">${fmt(p.price)}</span><span class="u">lei</span></div>
 </div>
 <div class="foot"><span>Comandă pe <b>novumsol.ro</b> · 0754 460 345</span></div>`;
 const can=s.querySelector('.can'), txt=s.querySelector('.txt');
 can.style.animation=`cardIn .85s cubic-bezier(.22,.9,.3,1) 0s both, cardOut .45s cubic-bezier(.55,0,.85,.3) ${D-0.48}s forwards`;
 txt.style.animation=`txtOut .45s cubic-bezier(.55,0,.85,.3) ${D-0.42}s forwards`;
 if(last){
  s.querySelector('.circle').style.animation=`circFill .55s cubic-bezier(.6,0,.3,1) ${D-0.55}s both`;
  s.querySelector('.ring').style.animation=`fadeOut .3s ease ${D-0.7}s both`;
  s.querySelector('.head').style.animation=`fadeOut .3s ease ${D-0.6}s both`;
  s.querySelector('.foot').style.animation=`fadeOut .3s ease ${D-0.6}s both`;
 }
 wrap.appendChild(s);
});
// bandă legală pe scenele cu produse și pe final
if(C.legal){document.querySelectorAll('.prod,#outro').forEach(sc=>{const d=document.createElement('div');d.className='legal';d.innerHTML=esc(C.legal);sc.appendChild(d);});}
function rng(seed){return ()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}
const LC=C.leafColors||['#E07A1F','#F2A93B','#C8501E','#E3B23C','#B85C1E'];
document.querySelectorAll('.leaves').forEach(box=>{const r=rng(+box.dataset.seed);const n=+box.dataset.n;
 for(let i=0;i<n;i++){const x=(i+.2+r()*.6)/n*1080-30,size=46+r()*46,dur=6+r()*4,delay=-r()*dur,sw=3+r()*2.5,c=LC[Math.floor(r()*LC.length)];
 const o=document.createElement('div');o.className='leaf';o.style.left=x+'px';o.style.animation=`fall ${dur}s linear ${delay}s infinite`;
 o.innerHTML=`<div style="animation:sway ${sw/2}s ease-in-out ${-r()*sw}s infinite alternate"><svg width="${size}" height="${size}" viewBox="0 0 100 100" style="opacity:${.75+r()*.25}"><path d="M50 4 C84 26 94 62 50 96 C6 62 16 26 50 4Z" fill="${c}"/><path d="M50 16 V92" stroke="rgba(80,30,0,.35)" stroke-width="4"/></svg></div>`;
 box.appendChild(o);} });
const scene=new URLSearchParams(location.search).get('s')||'intro';
$(scene).classList.add('on');
function fit(){document.querySelectorAll('.scene.on .fit').forEach(el=>{let fs=parseFloat(getComputedStyle(el).fontSize);const max=+el.dataset.max;while(el.offsetWidth>max&&fs>30){fs-=2;el.style.fontSize=fs+'px';}});}
window.seek=(ms)=>{document.getAnimations().forEach(a=>{a.pause();a.currentTime=ms;});};
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>{fit();seek(0);requestAnimationFrame(()=>{window.ready=true;});});
</script>
</body></html>

name: Sync produse novumsol.ro

on:
  schedule:
    - cron: '17 3 * * *'   # zilnic ~05:17 ora României
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/sync_products.py
      - name: Commit
        run: |
          git config user.name "novumsol-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "fără schimbări" && exit 0
          git commit -m "sync produse $(date +%F)"
          git pull --rebase
          git push
